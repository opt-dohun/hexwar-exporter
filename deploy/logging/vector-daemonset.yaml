apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: observability
  labels:
    app: vector
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      containers:
      - name: vector
        image: timberio/vector:0.41.X-debian
        imagePullPolicy: IfNotPresent
        args:
          - "--config"
          - "/etc/vector/vector.yaml"
        volumeMounts:
        - name: config
          mountPath: /etc/vector
          readOnly: true
        # 노드의 컨테이너 로그를 읽기 위해 호스트 볼륨 마운트 필요 (K3s/containerd 환경은 /var/log/pods 사용)
        - name: var-log
          mountPath: /var/log/
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: vector-config
      - name: var-log
        hostPath:
          path: /var/log/
---
# Kubernetes API에 접근하여 메타데이터(Pod 이름, 네임스페이스 등)를 가져오기 위한 권한
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
- apiGroups: [""]
  resources: ["namespaces", "nodes", "pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
subjects:
- kind: ServiceAccount
  name: vector
  namespace: observability
roleRef:
  kind: ClusterRole
  name: vector
  apiGroup: rbac.authorization.k8s.io
