apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: observability
data:
  vector.yaml: |
    # Vector Configuration
    # https://vector.dev/docs/reference/configuration/

    sources:
      # Kubernetes 노드에서 실행중인 컨테이너들의 stdout/stderr 수집
      kubernetes_logs:
        type: "kubernetes_logs"
        # HexWar 게임 서버 네임스페이스나 라벨에 맞춰 필터링 가능 (아래는 예시)
        # extra_namespace_label_selector: "app.kubernetes.io/name=hexwar-server"

    transforms:
      # 로그 포맷 다듬기 (필요 시 JSON 파싱 등 추가)
      process_logs:
        type: "remap"
        inputs: ["kubernetes_logs"]
        source: |-
          .timestamp = now()
          .message = .message # 기본 메시지 유지
          .level = "info" # 기본 레벨, 파싱 가능하면 변경
          
          # 게임 서버 로그가 JSON이면 아래 주석 해제하여 파싱
          # parsed, err = parse_json(.message)
          # if err == null {
          #   . = merge(., parsed)
          # }

    sinks:
      # Kafka로 전송
      kafka_sink:
        type: "kafka"
        inputs: ["process_logs"]
        bootstrap_servers: "kafka.observability.svc.cluster.local:9092"
        topic: "game-logs"
        encoding:
          codec: "json"
        
        # At-least-once 보장
        acknowledgements:
          enabled: true
